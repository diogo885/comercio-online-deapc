<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>StyleWear | Início</title>
    <link rel="stylesheet" href="styles/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<header>
    <div class="header-inner">
        <a class="logo" href="index.html">StyleWear</a>
        <nav>
            <a href="produtos.html">Coleções</a>
            <a href="carrinho.html">Carrinho</a>
        </nav>
    </div>
</header>

<main>
    <div class="main-wrap">
        <section class="hero">
            <div class="hero-text">
                <h1>Moda que combina conforto e estilo</h1>
                <p>Descobre a nova coleção de peças essenciais para o teu dia a dia.</p>
                <a href="produtos.html"><button>Ver coleção</button></a>
            </div>
            <div class="hero-visual">Imagem editorial da coleção</div>
        </section>

        <section class="auth-layout">
            <div class="auth-panel">
                <h2>Registo</h2>
                <form action="scripts/novoregisto.php" method="POST" onsubmit="return validarRegisto();">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>

                    <button type="submit">Registar</button>
                </form>
            </div>

            <div class="auth-panel">
                <h2>Login</h2>
                <form action="scripts/login.php" method="POST">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" required>

                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" required>

                    <button type="submit">Entrar</button>
                </form>
            </div>
        </section>
    </div>
</main>

<footer>
    <div class="footer-wrap">
        <p>StyleWear © 2026</p>
    </div>
</footer>

<script src="scripts/validacao.js"></script>
</body>
</html>
